# Content-Security-Policy for the Flutter web app (not applied to /api/ or the
# PocketBase dashboard at /_/, which ships its own UI).
#
# - The image is built with --no-web-resources-cdn, so CanvasKit loads from
#   /canvaskit/ instead of https://www.gstatic.com/flutter-canvaskit/.
# - 'wasm-unsafe-eval' lets CanvasKit compile its WebAssembly.
# - The build uses --csp, so main.dart.js needs no 'unsafe-eval'.
# - Flutter injects <style> elements, hence style-src 'unsafe-inline'.
# - When a glyph is missing from the bundled fonts, the engine fetches Noto
#   fallback fonts from https://fonts.gstatic.com (connect-src/font-src).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
