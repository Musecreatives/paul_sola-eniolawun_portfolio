# nginx config for the Flutter web build plus a same-origin proxy to PocketBase.
# Installed as /etc/nginx/conf.d/default.conf (included inside the http block).
#
# Caching: Flutter's web output is NOT content-hashed (main.dart.js, canvaskit/,
# assets/ keep the same names between releases). So nothing gets `immutable`:
# the app shell is `no-cache` (revalidated on every load via ETag, cheap 304s),
# and static files get a bounded max-age so a redeploy is picked up within a week
# at worst. Bump the max-age if you start fingerprinting file names.

# MIME types missing from nginx's stock mime.types (appended, not replaced).
types {
    font/ttf ttf;
    font/otf otf;
}

# Keep the scheme the client used when a TLS proxy (Caddy) sits in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket upgrade support (SSE works over plain HTTP/1.1 keep-alive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    # IPv4 only: Docker bridge networks have no IPv6 unless enabled, and a
    # [::]:80 listener makes nginx refuse to start there.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 20m;

    # Real client IP when the request comes through Caddy (or another proxy on a
    # private network). Requests from public addresses can't spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS. Resolving the upstream per request means nginx
    # starts even if PocketBase is down and follows it when its IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_static on;          # serves the *.gz files pre-compressed in the image
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/xml
        application/javascript text/javascript application/json
        application/manifest+json application/wasm image/svg+xml
        font/ttf font/otf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- PocketBase: REST API, realtime (SSE) and file downloads ----
    # PocketBase sends its own nosniff, X-Frame-Options and COOP headers, so
    # proxy.conf only adds what it lacks instead of the full security snippet.
    location ^~ /api/ {
        set $pocketbase http://pocketbase:8090;
        proxy_pass $pocketbase;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- PocketBase dashboard (superusers only) ----
    location ^~ /_/ {
        set $pocketbase http://pocketbase:8090;
        proxy_pass $pocketbase;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- Static files with a bounded cache ----
    location ^~ /canvaskit/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;

        # Manifests and bundled content change on every release.
        location ~ (\.json|\.bin|/NOTICES)$ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/csp.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
    }

    location ^~ /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /cv/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---- App shell and SPA fallback ----
    # index.html, flutter_bootstrap.js, flutter.js, flutter_service_worker.js,
    # main.dart.js, version.json, manifest.json, favicon.png and every client-side
    # route (/works, /admin, ...) land here: always revalidate.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
