# Shared proxy settings for PocketBase (/api/ and /_/).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Realtime (Server-Sent Events): stream immediately, keep idle connections open.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Uploads go straight through instead of being spooled to disk first.
proxy_request_buffering off;

# PocketBase already sets X-Content-Type-Options, X-Frame-Options and
# Cross-Origin-Opener-Policy; add only the two it doesn't.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
