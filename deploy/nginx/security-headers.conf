# Headers for every response. Included per location because nginx drops
# inherited add_header directives as soon as a location adds its own.
# HSTS lives in deploy/Caddyfile: only send it when TLS is actually in front.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
