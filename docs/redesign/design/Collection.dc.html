<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Collection</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/gallery.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600&amp;family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="wall-tyrian sans" style="color: #F3EEE3; padding: 96px 40px 120px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 64px">

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
<div class="mono rise" style="color: #E2C57F">Room VII</div>
<h2 class="alt rise d1" style="margin: 0; font-weight: 500; font-size: clamp(44px, 5vw, 68px); line-height: 1">The Collection</h2>
<p class="rise d2" style="margin: 0; max-width: 520px; font-size: 17px; line-height: 1.6; color: #E4D6F2">Things I keep coming back to: books, records, openings and the odd painting. Hung salon-style and rehung often.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px 32px; align-items: start">
<figure class="rise d2" style="grid-column: span 7; margin: 0; display: flex; flex-direction: column; gap: 16px">
<div class="frame" style="padding: 20px"><div class="win" style="aspect-ratio: 16 / 9"><img class="art" src="assets/menu_image3.png" alt="The School of Athens by Raphael"></div></div>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><span class="mono" style="font-size: 12px; color: #E2C57F">In the hall · Art</span><span class="alt" style="font-weight: 600; font-size: 18px">The School of Athens, Raphael</span></figcaption>
</figure>
<div style="grid-column: span 5; display: flex; flex-direction: column; gap: 40px">
<figure class="rise d3" style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div class="frame frame-sm"><div style="aspect-ratio: 3 / 2; background: #F6F2EA; color: #1C1830; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; padding: 20px; box-sizing: border-box"><div class="alt" style="font-weight: 600; font-size: 26px; color: #1F3A93">[Book title]</div><div class="mono" style="color: #4B1F5E">[Author]</div></div></div>
<figcaption class="mono" style="font-size: 12px; color: #E2C57F">On the shelf · Reading</figcaption>
</figure>
<figure class="rise d4" style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div class="frame frame-sm"><div style="aspect-ratio: 3 / 2; background-color: #0E0C26; background-image: linear-gradient(45deg, #221B52 25%, transparent 25%, transparent 75%, #221B52 75%), linear-gradient(45deg, #221B52 25%, transparent 25%, transparent 75%, #221B52 75%); background-size: 40px 40px; background-position: 0 0, 20px 20px; display: flex; align-items: center; justify-content: center"><div class="mono" style="background: #0E0C26; padding: 12px 20px; font-size: 14px; color: #E2C57F; letter-spacing: .08em">[Favourite opening]</div></div></div>
<figcaption class="mono" style="font-size: 12px; color: #E2C57F">On the board · Chess</figcaption>
</figure>
</div>
<figure class="rise" style="grid-column: span 4; margin: 0; display: flex; flex-direction: column; gap: 14px">
<div class="frame frame-sm"><div style="aspect-ratio: 1 / 1; background: #16123A; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; padding: 20px; box-sizing: border-box"><div style="width: 120px; height: 120px; border-radius: 50%; background: repeating-radial-gradient(circle, #0B0A1C 0 3px, #1E1850 3px 5px); display: flex; align-items: center; justify-content: center"><div style="width: 36px; height: 36px; border-radius: 50%; background: #4B1F5E; border: 1px solid #C9A24A"></div></div><div class="alt" style="font-weight: 600; font-size: 20px">[Record]</div><div class="mono" style="color: #A9A3C4">[Artist]</div></div></div>
<figcaption class="mono" style="font-size: 12px; color: #E2C57F">On the stand · Saxophone</figcaption>
</figure>
<figure class="rise d1" style="grid-column: span 4; margin: 0; display: flex; flex-direction: column; gap: 14px">
<div class="frame frame-sm" style="background: #0B0A1C; padding: 0"><div class="win" style="aspect-ratio: 1 / 1"><img class="art" src="assets/menu_image2.png" alt="Boxer at Rest, Hellenistic bronze" style="object-position: 85% 50%"></div></div>
<figcaption style="display: flex; flex-direction: column; gap: 4px"><span class="mono" style="font-size: 12px; color: #E2C57F">In the stands · Sport</span><span style="font-size: 14px; color: #E4D6F2">[Team or sport]</span></figcaption>
</figure>
<figure class="rise d2" style="grid-column: span 4; margin: 0; display: flex; flex-direction: column; gap: 14px">
<div class="frame frame-sm"><div class="plate" style="aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; padding: 20px; box-sizing: border-box"><div class="alt" style="font-weight: 600; font-size: 24px; color: #1F3A93">[Game]</div><div class="mono" style="color: #4B1F5E">[Platform]</div></div></div>
<figcaption class="mono" style="font-size: 12px; color: #E2C57F">In play · Gaming</figcaption>
</figure>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
