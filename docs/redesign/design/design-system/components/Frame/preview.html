<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600&family=Montserrat:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--wall);font-family:"Montserrat",system-ui,sans-serif}
.room{position:relative;padding:28px 48px 64px;display:flex;flex-direction:column;align-items:center}
.lamp{width:140px;height:7px;border-radius:var(--radius-lamp);background:var(--gilt);box-shadow:var(--shadow-lamp);margin-bottom:18px}
.frame{width:100%;max-width:420px;box-sizing:border-box;border:14px solid var(--frame-moulding);outline:1px solid var(--frame-fillet);outline-offset:-9px;background:var(--matte);padding:18px;box-shadow:var(--shadow-frame)}
.win{overflow:hidden;aspect-ratio:16/10}
.win img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.32)}
.placard{position:absolute;right:40px;bottom:16px;width:220px;background:var(--placard);color:var(--placard-ink);padding:12px 14px;box-shadow:var(--shadow-placard);display:flex;flex-direction:column;gap:3px}
.lbl{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tyrian)}
.t{font-family:"Montserrat Alternates",sans-serif;font-weight:600;font-size:16px}
.m{font-size:13px;color:var(--placard-muted)}
</style>
<div class="room">
<div class="lamp"></div>
<div class="frame"><div class="win"><img src="/_blob/fea086a7cc8f2e45fadbd9c1d9857fc8" alt="The School of Athens by Raphael"></div></div>
<div class="placard"><span class="lbl">Inv. 1511–RA</span><span class="t">The School of Athens</span><span class="m">Raphael, 1509–1511 · Fresco</span></div>
</div>
