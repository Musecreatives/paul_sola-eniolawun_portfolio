<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Paul Sola-Eniolawun · The Collection</title>
  <meta name="description" content="Developer + Computer Scientist. Full-stack engineer in Flutter, Node.js and Python. VP of Engineering at Synkkafrica, building marketplace and admin platforms that scale.">
  <meta name="author" content="Paul Sola-Eniolawun">
  <meta name="theme-color" content="#16123A">
  <meta name="color-scheme" content="dark light">

  <!--
    TODO(paul): replace [DOMAIN] with the live domain (the same value as DOMAIN
    in .env). Open Graph and Twitter need absolute URLs for og:url and og:image.
  -->
  <link rel="canonical" href="https://[DOMAIN]/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Paul Sola-Eniolawun · The Collection">
  <meta property="og:title" content="Paul Sola-Eniolawun · The Collection">
  <meta property="og:description" content="Developer + Computer Scientist. Full-stack engineer in Flutter, Node.js and Python, and VP of Engineering at Synkkafrica.">
  <meta property="og:url" content="https://[DOMAIN]/">
  <meta property="og:image" content="https://[DOMAIN]/assets/assets/img/art_school_of_athens.webp">
  <meta property="og:image:alt" content="The School of Athens by Raphael, hung in a gilt frame">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paul Sola-Eniolawun · The Collection">
  <meta name="twitter:description" content="Developer + Computer Scientist. Full-stack engineer in Flutter, Node.js and Python, and VP of Engineering at Synkkafrica.">
  <meta name="twitter:image" content="https://[DOMAIN]/assets/assets/img/art_school_of_athens.webp">
  <meta name="twitter:image:alt" content="The School of Athens by Raphael, hung in a gilt frame">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Collection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
  <style>
    /* The night wall shows while Flutter loads, instead of a white flash. */
    html, body { margin: 0; background: #0B0A1C; }
  </style>
</head>
<body>
  <noscript>
    <p style="font-family: sans-serif; color: #F3EEE3; padding: 24px;">
      Paul Sola-Eniolawun · The Collection. This site needs JavaScript.
      Write to paulsolaeniolawun@gmail.com.
    </p>
  </noscript>
  <script src="locale_guard.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
